<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Modern Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyberpunk"> <!-- Default theme -->

    <!-- MAIN MENU SCREEN -->
    <div id="screen-menu" class="screen active">
        <div class="menu-container">
            <h1 class="game-title">MODERN<br>TETRIS</h1>
            
            <div class="theme-selector">
                <p>SELECT AESTHETIC:</p>
                <div class="theme-buttons">
                    <button class="theme-btn active" data-theme="cyberpunk">CYBERPUNK</button>
                    <button class="theme-btn" data-theme="vibrant">VIBRANT</button>
                    <button class="theme-btn" data-theme="zen">ZEN</button>
                </div>
            </div>

            <div class="menu-buttons">
                <button id="btn-start" class="menu-btn primary">START GAME</button>
                <button id="btn-settings" class="menu-btn">SETTINGS</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS SCREEN -->
    <div id="screen-settings" class="screen">
        <div class="menu-container">
            <h2>SETTINGS</h2>
            <div class="settings-list">
                <div class="setting-row">
                    <span>Ghost Piece</span>
                    <input type="checkbox" id="toggle-ghost" checked>
                </div>
                <div class="setting-row">
                    <span>Hold Piece</span>
                    <input type="checkbox" id="toggle-hold" checked>
                </div>
                <div class="setting-row">
                    <span>Next Queue</span>
                    <input type="checkbox" id="toggle-next" checked>
                </div>
                <div class="setting-row">
                    <span>Mobile Controls</span>
                    <select id="toggle-mobile-controls">
                        <option value="swipe">Swipe Gestures</option>
                        <option value="dpad">On-Screen D-Pad</option>
                    </select>
                </div>

                <!-- SOUND SETTINGS SECTION -->
                <div class="settings-divider"></div>
                <h3 class="settings-section-title">SOUND</h3>
                
                <div class="setting-row">
                    <span>Mute Sound</span>
                    <input type="checkbox" id="toggle-mute">
                </div>
                
                <div class="setting-row radio-row">
                    <span>Sound Style</span>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="sound-style" value="modern" checked> Modern
                        </label>
                        <label>
                            <input type="radio" name="sound-style" value="retro"> Retro
                        </label>
                    </div>
                </div>
                <!-- END SOUND SETTINGS -->

            </div>
            <button id="btn-back-settings" class="menu-btn">BACK</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen">
        <div class="game-ui">
            <div class="side-panel left">
                <div class="ui-box">
                    <h3>HOLD</h3>
                    <canvas id="canvas-hold" width="100" height="100"></canvas>
                </div>
            </div>
            
            <div class="center-panel">
                <canvas id="canvas-board" width="300" height="600"></canvas>
            </div>

            <div class="side-panel right">
                <div class="ui-box">
                    <h3>NEXT</h3>
                    <canvas id="canvas-next" width="100" height="300"></canvas>
                </div>
                <div class="ui-box" id="power-meter-container">
                    <h3>POWER</h3>
                    <div class="power-bar">
                        <div id="power-fill" class="power-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="game-over-overlay" class="overlay hidden">
        <div class="game-over-box">
            <h1 class="game-over-title">GAME OVER</h1>
            <p class="final-score-label">FINAL SCORE</p>
            <p class="final-score-value" id="final-score-display">0</p>
            <button id="btn-restart" class="menu-btn primary">RESTART</button>
            <button id="btn-main-menu" class="menu-btn secondary">MAIN MENU</button>
        </div>
    </div>

    <!-- Scripts (Sound loaded first) -->
    <script src="js/sound.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/input.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
